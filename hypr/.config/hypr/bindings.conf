# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
# Chrome is intentionally forced to XWayland in ~/.config/chrome-flags.conf.
# Run Ghostty there too so PRIMARY-selection middle-click paste works both ways.
$terminal = uwsm app -- env GDK_BACKEND=x11 ghostty --gtk-single-instance=false
$browser = uwsm app -- google-chrome-stable --profile-directory="Default" --new-window
$fluxonbrowser = uwsm app -- google-chrome-stable --profile-directory="Profile 1" --new-window

bindd = SUPER, RETURN, Terminal, exec, $terminal
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER ALT, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, period, Mouse Keys, exec, mousekeys show
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER, P, Browser (private), exec, $browser --private
bindd = SUPER, period, Mouse Keys, exec, mousekeys show

bindd = SUPER SHIFT, B, Browser, exec, $fluxonbrowser
bindd = SUPER, A, Asteroids, exec, uwsm app -- ~/.cargo/bin/asteroids
# SUPER+M moved to hyprland.conf for YouTube Music special workspace
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
# Rebind screen agent from the old study-screen-agent PID path.
unbind = CTRL SHIFT, A
bindd = CTRL SHIFT, A, Screen agent, exec, sh -c 'kill -USR1 "$(cat "$XDG_RUNTIME_DIR/screen-agent/screen-agent.pid")"'
bindd = CTRL SHIFT, R, Screenrecording with microphone, exec, omarchy capture screenrecording --with-microphone-audio
# SUPER+O moved to hyprland.conf for Obsidian special workspace
unbind = SUPER, O

# bindd = SUPER SHIFT, slash, Passwords, exec, uwsm app -- 1password
# SUPER+S moved to hyprland.conf for Slack special workspace
unbind = SUPER, S 
# bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
# bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
# bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
# bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
# bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Media transport keys
unbind = , XF86AudioNext
unbind = , XF86AudioPause
unbind = , XF86AudioPlay
unbind = , XF86AudioPrev
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPause, Play/pause, exec, playerctl play-pause
bindld = , XF86AudioPlay, Play/pause, exec, playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous
bindld = , code:163, Next track, exec, playerctl next
bindld = , code:165, Previous track, exec, playerctl previous
bindld = , code:200, Play/pause, exec, playerctl play-pause
bindld = , code:201, Play/pause, exec, playerctl play-pause
unbind = SUPER, RIGHT
bindld = SUPER, backslash, Play/pause, exec, playerctl play-pause
bindld = SUPER, RIGHT, Next track, exec, playerctl next


bind = SUPER SHIFT, F, fullscreen, 0

# Emergency submap: Ctrl+Alt+Delete enters emergency mode
bindd = CTRL ALT, Delete, Emergency mode, submap, emergency
submap = emergency
bindd = , r, Reboot, exec, systemctl reboot
bindd = , s, Shutdown, exec, systemctl poweroff
bindd = , l, Log out, exec, hyprctl dispatch exit
bindd = , escape, Cancel, submap, reset
bindd = , catchall, Cancel, submap, reset
submap = reset
