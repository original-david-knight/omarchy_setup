# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # Small gaps between tiled windows
    gaps_in = 4
    gaps_out = 6

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 4
}

# Disable HDR
render {
    cm_auto_hdr = 0
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    # Variable Refresh Rate. Kept OFF: Chrome runs under XWayland here (forced by
    # the Wayland+Vulkan incompatibility, see ~/.config/chrome-flags.conf), and
    # XWayland clients don't drive VRR cleanly -- always-on VRR jitter was the
    # likely cause of ~50% dropped frames on the 165Hz panel. Fixed refresh gives
    # the X11 client a stable vsync estimate. 0 = off, 1 = always, 2 = fullscreen.
    vrr = 0
}
