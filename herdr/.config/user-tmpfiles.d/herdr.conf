# Start Herdr fresh after reboot by discarding saved layouts and pane history.
# The ! limits removal to boot-time setup; normal detach/reattach keeps working.
# activate.sh enables systemd-tmpfiles-setup.service without running it mid-session.
r! %h/.config/herdr/session.json - - - -
r! %h/.config/herdr/session-history.json - - - -
r! %h/.config/herdr/sessions/*/session.json - - - -
r! %h/.config/herdr/sessions/*/session-history.json - - - -
