mode = "dark"

# Beachview: Tokyo Night's structure with hues pushed apart so each syntax
# class reads as its own color. Plain text is a neutral off-white rather than
# Tokyo Night's blue-grey, magenta leans orchid instead of violet, cyan is a
# bright turquoise distinct from the ocean blue, and bright variants are
# visibly lighter than their normal counterparts.

accent = "#2fd8c8"
# Window borders stay quiet: a desaturated sea-slate instead of the accent.
hyprland_active_border = "#5d7686"
