# The Listening widget's equalizer: a virtual sink that Spotify, podcasts and
# myNoise play into, passing on to the current default output. Other audio
# never enters it. Gains start flat; the widget's `eq` helper sets the saved
# curve whenever filter-chain.service starts and on every edit.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Listening EQ"
            media.name = "Listening EQ"
            filter.graph = {
                nodes = [
                    # The helper lowers this by the largest boost to add headroom.
                    { type = builtin name = preamp label = linear control = { "Mult" = 1.0 "Add" = 0.0 } }
                    { type = builtin name = band_1 label = bq_lowshelf control = { "Freq" = 32.0 "Q" = 0.7 "Gain" = 0.0 } }
                    { type = builtin name = band_2 label = bq_peaking control = { "Freq" = 64.0 "Q" = 1.41 "Gain" = 0.0 } }
                    { type = builtin name = band_3 label = bq_peaking control = { "Freq" = 125.0 "Q" = 1.41 "Gain" = 0.0 } }
                    { type = builtin name = band_4 label = bq_peaking control = { "Freq" = 250.0 "Q" = 1.41 "Gain" = 0.0 } }
                    { type = builtin name = band_5 label = bq_peaking control = { "Freq" = 500.0 "Q" = 1.41 "Gain" = 0.0 } }
                    { type = builtin name = band_6 label = bq_peaking control = { "Freq" = 1000.0 "Q" = 1.41 "Gain" = 0.0 } }
                    { type = builtin name = band_7 label = bq_peaking control = { "Freq" = 2000.0 "Q" = 1.41 "Gain" = 0.0 } }
                    { type = builtin name = band_8 label = bq_peaking control = { "Freq" = 4000.0 "Q" = 1.41 "Gain" = 0.0 } }
                    { type = builtin name = band_9 label = bq_peaking control = { "Freq" = 8000.0 "Q" = 1.41 "Gain" = 0.0 } }
                    { type = builtin name = band_10 label = bq_highshelf control = { "Freq" = 16000.0 "Q" = 0.7 "Gain" = 0.0 } }
                ]
                links = [
                    { output = "preamp:Out" input = "band_1:In" }
                    { output = "band_1:Out" input = "band_2:In" }
                    { output = "band_2:Out" input = "band_3:In" }
                    { output = "band_3:Out" input = "band_4:In" }
                    { output = "band_4:Out" input = "band_5:In" }
                    { output = "band_5:Out" input = "band_6:In" }
                    { output = "band_6:Out" input = "band_7:In" }
                    { output = "band_7:Out" input = "band_8:In" }
                    { output = "band_8:Out" input = "band_9:In" }
                    { output = "band_9:Out" input = "band_10:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "listening_eq"
                media.class = Audio/Sink
                # Below every real output, so it is never picked as the default.
                priority.session = 1
            }
            playback.props = {
                node.name = "listening_eq.output"
                node.passive = true
            }
        }
    }
]
